name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # DATUM.Connector.SolidWorks is deliberately absent from this job. It references the SOLIDWORKS
  # interop assemblies, which ship with the product and are not redistributable, so it
  # cannot build on a hosted runner. DATUM.NoSolidWorks.slnf is the buildable subset —
  # and it happens to contain the entire safety model minus the COM calls.
  dotnet:
    name: .NET (contracts, orchestrator, tests)
    # Windows because this is a Windows-only product: the orchestrator uses named-pipe
    # ACLs and WindowsIdentity, which compile anywhere but only mean anything here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Building the test project pulls in Contracts and Orchestrator transitively, and
      # avoids depending on how a solution filter resolves the x64-only platform.
      - name: Restore
        run: dotnet restore tests/DATUM.Tests/DATUM.Tests.csproj

      - name: Build
        run: dotnet build tests/DATUM.Tests/DATUM.Tests.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/DATUM.Tests/DATUM.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/test
          if-no-files-found: ignore

  # Verifies the kernel at least parses and that no non-interop compile error has crept
  # in. It will fail on the missing SOLIDWORKS references, which is expected and why the
  # step is advisory rather than gating.
  kernel-syntax:
    name: Kernel (advisory — needs a SOLIDWORKS seat to build)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Attempt kernel build
        run: dotnet build src/DATUM.Connector.SolidWorks/DATUM.Connector.SolidWorks.csproj -c Release

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      # The kernel's own test suite. It was not run here until now, which meant the exact
      # predicates, the boolean engine, the constraint solver and every importer were gating
      # nothing — the job checked that the TypeScript compiled and stopped there.
      - name: Test
        run: npm test

      # The benchmark is a gate, not a report: a regression means the product got worse at the
      # thing it exists to do. It runs offline with no model configured, so it costs nothing
      # and returns the same answer twice.
      - name: Benchmark
        run: npx vitest run src/eval/eval.test.ts

      # `npm run build` runs `tsc --noEmit` first, so strict TypeScript is gating.
      - name: Typecheck and build
        run: npm run build

      # The headless surface, built and exercised.
      #
      # It is what makes the product checkable by anything other than a person: a part can be
      # built, measured and gated in CI, a folder can be run in one pass, and an agent can
      # drive it and read the evidence back. A build that compiles but whose CLI cannot run a
      # script is a surface nobody can rely on.
      - name: Headless build
        run: npm run cli

      - name: Headless smoke test
        run: |
          printf 'box Body length=120 width=80 height=10\nhole Bore diameter=20 holeType=through pattern=single x=0 y=0\n' > /tmp/smoke.datum
          node dist-cli/datum.mjs run /tmp/smoke.datum --json
          node dist-cli/datum.mjs dfm /tmp/smoke.datum --json
          node dist-cli/datum.mjs export /tmp/smoke.datum --out /tmp/smoke.step
          node dist-cli/datum.mjs corpus --count 20 --seed 1 --out /tmp/corpus.jsonl --json

      # Every figure this project states about itself, regenerated and compared.
      #
      # Five documents here once stated five different test counts, five different archetype
      # counts and three different constraint counts — every one of them true on the day it
      # was typed. In a technical review a stale count does not read as staleness; it reads as
      # a claim that did not survive checking, and it puts every other claim in the document
      # in question. So no number is maintained by hand, and a commit that changes one without
      # regenerating fails here.
      - name: Facts are current
        run: |
          npm run facts
          git diff --exit-code ../docs/FACTS.md \
            || (echo "::error::docs/FACTS.md is out of date — run 'npm --prefix ui run facts'" && exit 1)

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
